<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Dermiére">
  <!--
    Favicon: the DERMIERE wordmark, laid out like the CAPTURE icon it
    replaces - ink serif capitals, widely letterspaced, centred on the
    ivory brand ground.

    DERMIERE is one letter longer than CAPTURE, so the size is set a little
    smaller to keep the same side margins.
  -->
  <rect width="512" height="512" fill="#F9F3E4"/>
  <text
    x="249"
    y="256"
    fill="#14120E"
    font-family="Georgia, 'Times New Roman', 'Didot', serif"
    font-size="66"
    letter-spacing="13"
    text-anchor="middle"
    dominant-baseline="central"
  >DERMIERE</text>
</svg>
